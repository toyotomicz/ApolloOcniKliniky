# Optional override for running the API and frontend outside Docker (dotnet run / npm run dev):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
# Publishes PostgreSQL on localhost only. Email goes through the SMTP server configured in .env (Gmail).
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
