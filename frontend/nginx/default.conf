server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API (and Swagger, when enabled) live in the "api" container on the internal Docker network.
    # The browser only ever talks to this origin, so no CORS is needed.
    location ~ ^/(api|swagger|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot spoof their address for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # No "always": a 404 for a chunk of an older build must not be cached.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
