# Behind an HTTPS proxy (Caddy) keep its X-Forwarded-Proto; otherwise use the request's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Behind Caddy (docker-compose.https.yml) every request arrives from Caddy's container address, which
    # would make all visitors share one rate-limit bucket. Caddy overwrites X-Forwarded-For with the real
    # client address, so it is trusted from private (Docker network) addresses only; a public client that
    # connects directly cannot spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API (and Swagger, when enabled) live in the "api" container on the internal Docker network.
    # The browser only ever talks to this origin, so no CORS is needed.
    location ~ ^/(api|swagger|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) with the resolved client address so clients cannot spoof it for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Realtime notifications for administrators (SignalR). WebSocket upgrade, long-lived connections.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # No "always": a 404 for a chunk of an older build must not be cached.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
